# PID gains of the Gazebo 'position_pid' command interface, used by the trajectory controller
# (rizon_arm_controller) in simulation: the commanded position is tracked with joint torques,
# so the motion follows the dynamics (no teleport as with the plain 'position' interface).
#
# Gazebo does not compensate gravity: the integral term holds the arm, its torque is clamped to
# about the maximum gravity load of each joint [Nm].
#
# Chosen for the Rizon4s URDF inertias at 1 kHz: dt * lambda_max(M^-1 kd) <= 0.77 over the
# workspace (stability limit 2). Joints 1 and 3 are weakly damped when their axes line up
# (joint2 ~ 0); raising kd there quickly makes the light wrist modes chatter.
position_pid_gains:
  joint1: {kp: 500.0,  ki: 0.0,   kd: 10.0, max_integral_error: 10.0, min_integral_error: -10.0}
  joint2: {kp: 1000.0, ki: 400.0, kd: 40.0, max_integral_error: 60.0, min_integral_error: -60.0}
  joint3: {kp: 150.0,  ki: 30.0,  kd: 2.0,  max_integral_error: 5.0,  min_integral_error: -5.0}
  joint4: {kp: 400.0,  ki: 200.0, kd: 12.0, max_integral_error: 35.0, min_integral_error: -35.0}
  joint5: {kp: 40.0,   ki: 10.0,  kd: 1.0,  max_integral_error: 5.0,  min_integral_error: -5.0}
  joint6: {kp: 40.0,   ki: 10.0,  kd: 1.0,  max_integral_error: 5.0,  min_integral_error: -5.0}
  joint7: {kp: 8.0,    ki: 0.0,   kd: 0.25, max_integral_error: 1.0,  min_integral_error: -1.0}
